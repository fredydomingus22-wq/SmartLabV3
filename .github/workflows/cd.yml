name: CD - Deploy to Production

on:
  push:
    branches: [ "main" ]

env:
  VERCEL_ORG_ID: SMMWA23c4UIKeAM87kHQtuxe
  VERCEL_PROJECT_ID: prj_bYEUEdjQ2MliABgpaXAbgGZ6SigK

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=tioWX1ZcGxS7T3xT8FF6N2A3

      - name: Build Project Artifacts
        run: vercel build --prod --token=tioWX1ZcGxS7T3xT8FF6N2A3

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=tioWX1ZcGxS7T3xT8FF6N2A3 
